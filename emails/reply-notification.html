<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New reply on your update</title>
</head>
<body style="margin:0; padding:0; background-color:#f6f7f8; font-family:Helvetica, Arial, sans-serif;">
<center style="width:100%; background-color:#f6f7f8;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; margin:0 auto;">
  <tr>
    <td style="padding:24px 24px 0 24px;">
      <table role="presentation" cellpadding="0" cellspacing="0">
        <tr>
          <td style="width:32px; height:32px; background-color:#137fec; border-radius:8px; text-align:center; vertical-align:middle;">
            <span style="color:#ffffff; font-size:16px; font-weight:bold; line-height:32px;">S</span>
          </td>
          <td style="padding-left:10px; font-size:16px; font-weight:bold; color:#0d141b;">Subbie HQ</td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td style="padding:24px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border:1px solid #e7edf3; border-radius:12px;">
        <tr>
          <td style="padding:28px 28px 20px 28px;">
            <p style="margin:0 0 4px 0; font-size:11px; font-weight:bold; text-transform:uppercase; letter-spacing:0.05em; color:#4c739a;">{{project_name}}</p>
            <p style="margin:0 0 20px 0; font-size:18px; font-weight:bold; color:#0d141b;">{{author_name}} replied to your update</p>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f7f8; border-radius:8px; margin-bottom:24px;">
              <tr>
                <td style="padding:16px 18px; font-size:14px; line-height:20px; color:#0d141b;">
                  {{update_body}}
                </td>
              </tr>
            </table>

            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td style="border-radius:8px; background-color:#137fec;">
                  <a href="{{update_url}}" style="display:inline-block; padding:12px 24px; font-size:14px; font-weight:bold; color:#ffffff; text-decoration:none;">View Update</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td style="padding:0 24px 24px 24px; text-align:center;">
      <p style="margin:0; font-size:12px; color:#4c739a;">
        You're receiving this because you posted an update on {{project_name}} in Subbie HQ.
      </p>
    </td>
  </tr>
</table>
</center>
</body>
</html>
